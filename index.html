<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ケア内容選択｜訪問介護 申し送り作成ツール</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <h1>訪問介護 申し送り作成ツール</h1>
  <div class="steps">
    <div class="step active">1. ケア内容選択</div>
    <div class="step">2. 報告書プレビュー</div>
    <div class="step">3. 申し送り15種類</div>
  </div>
</header>

<div class="container">
  <section class="card">
    <h2>訪問情報</h2>
    <div class="field-grid">
      <label class="field">利用者名
        <input type="text" id="userName" placeholder="例：山田 太郎" />
      </label>
      <label class="field">訪問日
        <input type="date" id="visitDate" />
      </label>
      <label class="field">開始時刻
        <input type="time" id="startTime" />
      </label>
      <label class="field">終了時刻
        <input type="time" id="endTime" />
      </label>
      <label class="field">担当ヘルパー名
        <input type="text" id="staffName" placeholder="例：佐藤 花子" />
      </label>
    </div>
  </section>

  <section class="card">
    <h2>ケア内容</h2>
    <p class="hint">実施した項目にチェックを入れてください。チェックすると詳細入力欄が表示されます。</p>
    <div id="itemGroups"></div>
  </section>

  <section class="card">
    <h2>特記事項</h2>
    <p class="hint">チェック項目に当てはまらない気づき・様子・引き継ぎたいことを自由に記入してください。</p>
    <textarea id="specialNotes" rows="4" placeholder="例：ご本人より膝の痛みの訴えあり。次回訪問時に様子確認をお願いします。"></textarea>
  </section>

  <div class="actions">
    <button type="button" class="ghost" id="resetBtn">入力内容をリセット</button>
    <button type="button" class="primary" id="nextBtn">次へ（報告書プレビュー）</button>
  </div>
</div>

<script src="js/itemDefs.js"></script>
<script src="js/storage.js"></script>
<script src="js/step1.js"></script>
</body>
</html>
